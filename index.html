const blob=new Blob([html],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`mission-report-${(session.agency||'team').toLowerCase().replace(/[^a-z0-9]+/g,'-')}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return html;

const icons={animal:'🐘',pencils:'✏️',letters:'🔠',riddle:'❔',dictionary:'📖',clock:'◷',grammar:'📝',cipher:'⌁',camera:'▣',evidence:'◈'};
const app=document.querySelector('#app');let db=read();db.settings??={duration:17,sound:false,teacher:false,competitive:false};db.sessions??={};let screen='home',levelId=null,selectedMission=null,feedback='',hint='',modal='',timerLoop=null,toneCtx=null;
function blank(level,agency){return {agency,completed:0,digits:[null,null,null,null],answers:[{},{},{},{}],attempts:[0,0,0,0],hints:[0,0,0,0],remaining:db.settings.duration*60,running:false,deadline:null,elapsed:0,finalAttempt:'',victory:false,startedAt:new Date().toISOString(),approved:[false,false,false,false]}}
function level(){return LEVELS.find(x=>x.id===levelId)}function session(){return db.sessions[levelId]}function save(){write(db)}function score(){return session()?.completed*25||0}
function sound(type){if(!db.settings.sound)return;try{toneCtx??=new (window.AudioContext||window.webkitAudioContext)();const ctx=toneCtx;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type==='fail'?'sawtooth':'sine';osc.frequency.setValueAtTime(type==='fail'?180:type==='win'?550:430,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(type==='fail'?95:type==='win'?990:670,ctx.currentTime+.2);gain.gain.setValueAtTime(.055,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.28);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.29)}catch{}}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.cssText='position:fixed;z-index:300;bottom:20px;left:50%;transform:translateX(-50%);background:#203b46;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px #0009;max-width:90%';clearTimeout(toast._t);toast._t=setTimeout(()=>el.textContent='',2600)}
function header(){return `<header class="topbar"><div class="brand">◈ THE SECRET CODE <small>ENGLISH ESCAPE ROOM · ASPAEN NEIVA</small></div><div class="row"><button class="btn ghost sm" data-action="home">⌂ HOME</button><button class="btn ghost sm" data-action="sound">${db.settings.sound?'♫ SOUND ON':'♪ SOUND OFF'}</button><button class="btn ghost sm" data-action="teacher">⚙ TEACHER</button></div></header>`}
function shell(body){app.innerHTML=`<div class="app ${level()?.theme||''}">${header()}<main>${body}</main><footer class="footer">ASPAEN NEIVA · SECURE TRAINING SIMULATION · YOUR WRITTEN RESPONSES REQUIRE TEACHER REVIEW</footer></div>${modal?modalHtml():''}`}
function home(){shell(`<div class="hero container"><div class="eyebrow">◈ ASPAEN NEIVA · CLASSIFIED TRAINING PROGRAM ◈</div><h1>THE SECRET CODE</h1><h2>ENGLISH ESCAPE ROOM</h2><p>Four missions. Four digits. One secret code.</p><div class="vault-hero" aria-hidden="true"><div class="vault-wheel">✣</div></div><div class="row" style="justify-content:center"><button class="btn primary" data-action="levels">▶ START MISSION</button><button class="btn" data-action="how">HOW TO PLAY</button><button class="btn ghost" data-action="teacher">TEACHER DASHBOARD</button></div></div>`)}
function levels(){shell(`<div class="container"><div class="screen-title"><div class="eyebrow">MISSION CONTROL · STEP 01</div><h1>SELECT YOUR CLEARANCE LEVEL</h1><p class="muted">Choose your grade group. Every level contains four different missions.</p></div><div class="grid4">${LEVELS.map((x,i)=>`<div class="level-card" style="--level:${['#41dba0','#3fcee8','#ffb84a','#ff6978'][i]}"><div class="emblem">${['◇','◎','⌁','⬡'][i]}</div><div class="stamp">LEVEL 0${x.id}</div><h3>${x.name}</h3><p>${x.grades}<br>${x.story}</p><button class="btn" data-action="choose" data-id="${x.id}">SELECT LEVEL →</button></div>`).join('')}</div></div>`)}
function agency(){let x=level(),s=session();shell(`<div class="container" style="max-width:650px;padding:65px 0"><div class="panel"><div class="eyebrow">LEVEL ${x.id} · ${x.story}</div><h1>CREATE YOUR AGENCY</h1><p class="muted">Your progress is stored on this device and browser only.</p><label class="form-label" for="agency">AGENCY NAME</label><input id="agency" maxlength="55" class="input-dark" placeholder="Enter team or agency name" value="${safe(s?.agency||'')}"><div class="row" style="margin-top:22px"><button class="btn primary" data-action="begin">BEGIN OPERATION →</button><button class="btn ghost" data-action="levels">CHANGE LEVEL</button></div>${s?`<p class="small">Saved: ${s.completed}/4 missions · ${s.completed*25} points</p>`:''}</div></div>`)}
function codePanel(){let s=session();return `<div class="hud"><div><div class="eyebrow">CODE PROGRESS</div><div class="digits">${s.digits.map(d=>`<div class="digit ${d==null?'empty':''}">${d??'_'}</div>`).join('')}</div></div><div><div class="eyebrow">TEAM SCORE</div><b>${score()} / 100</b></div><div><div class="eyebrow">TIME REMAINING</div><div class="timer ${s.remaining<=120?'warning':''}" id="timer-display">${fmt(s.remaining)}</div></div><div class="row"><button class="btn sm" data-action="timer" ${s.remaining<=0?'disabled':''}>${s.running?'Ⅱ PAUSE':'▶ START / RESUME'}</button><button class="btn sm ghost" data-action="resetTimer">RESET TIMER</button></div></div>`}
function fmt(n){return `${String(Math.floor(Math.max(n,0)/60)).padStart(2,'0')}:${String(Math.max(n,0)%60).padStart(2,'0')}`}
function side(){let s=session();return `<aside class="sidebar">${level().missions.map((m,i)=>`<button class="mission-step ${i<s.completed?'done':''} ${i===selectedMission?'active':''}" data-action="mission" data-index="${i}" ${i>s.completed?'disabled':''}><span>${i<s.completed?'✓ COMPLETED':i===s.completed?'◈ UNLOCKED':'🔒 LOCKED'} · MISSION ${i+1}</span><strong>${safe(m.title)}</strong></button>`).join('')}</aside>`}
function missionContents(m,i){let s=session(),done=i<s.completed;return `<div class="mission-card"><div class="mission-header"><div class="mission-icon">${icons[m.icon]}</div><div><div class="tag">MISSION 0${i+1} · ${safe(m.tag)}</div><h2>${safe(m.title)}</h2><span class="stamp">${safe(level().story)} · CLASSIFIED</span></div></div>${m.intro?`<p><strong>${safe(m.intro)}</strong></p>`:''}${m.quote?`<blockquote>${safe(m.quote)}</blockquote>`:''}${m.chips?`<div class="chips">${m.chips.map(c=>`<span class="chip">${safe(c)}</span>`).join('')}</div>`:''}${m.cipher?`<div class="cipher" aria-label="Encoded message">${safe(m.cipher)}</div>`:''}${m.lines?`<ol class="numbered">${m.lines.map(t=>`<li>${safe(t)}</li>`).join('')}</ol>`:''}${m.questions?`<ol class="numbered">${m.questions.map(t=>`<li>${safe(t)}</li>`).join('')}</ol>`:''}${m.body?m.body.map(t=>`<p>${safe(t)}</p>`).join(''):''}<div class="field-group"><div class="tag" style="margin-top:20px">AGENT NOTES · FOR TEACHER REVIEW</div>${m.fields.map(([key,label,kind])=>`<label class="field"><span>${safe(label)}</span>${kind==='long'?`<textarea data-field="${key}" ${done?'readonly':''} placeholder="Type your answer in English…">${safe(s.answers[i]?.[key]||'')}</textarea>`:`<input data-field="${key}" ${done?'readonly':''} value="${safe(s.answers[i]?.[key]||'')}" placeholder="Your answer…">`}</label>`).join('')}</div><div class="secret-instruction"><strong>🔐 SECRET CODE INSTRUCTION</strong><p>${safe(m.instruction)}</p><div class="code-entry"><label>${DIGIT_LABELS[i]} digit: <input id="digit-entry" aria-label="${DIGIT_LABELS[i]} digit" inputmode="numeric" autocomplete="off" maxlength="1" value="${done?s.digits[i]:''}" ${done?'readonly':''}></label>${!done?`<button class="btn primary" data-action="verify" ${s.remaining<=0?'disabled':''}>VERIFY CODE</button>`:'<span style="color:#17644c;font-weight:900">✓ VERIFIED</span>'}</div></div>${feedback&&i===selectedMission?`<div class="feedback ${feedback.startsWith('ACCESS DENIED')?'error':''}" role="status">${safe(feedback)}${feedback.startsWith('ACCESS GRANTED')?`<div style="margin-top:12px"><button class="btn primary" data-action="next">${s.completed===4?'FINAL SECURITY CHECK':'NEXT MISSION →'}</button></div>`:''}</div>`:''}${!done?`<div class="row" style="margin-top:14px"><button class="btn sm" data-action="hint" ${s.hints[i]>=2?'disabled':''}>GET A HINT (${2-s.hints[i]} LEFT)</button><span class="small">Attempts: ${s.attempts[i]}</span></div>${hint?`<div class="hint">💡 ${safe(hint)}</div>`:''}`:''}</div>`}
function mission(){let s=session();if(!s){screen='agency';return agency()}if(selectedMission==null)selectedMission=Math.min(s.completed,3);let i=selectedMission;if(i>s.completed){selectedMission=s.completed;i=s.completed}if(s.completed===4&&i===4){screen='safe';return safeScreen()}shell(`<div class="container"><div class="screen-title"><div class="eyebrow">LEVEL 0${levelId} · ${safe(s.agency)}</div><h2>${safe(level().name)}</h2><p class="muted">Four classified missions. Only verified digits unlock the next mission.</p></div>${codePanel()}<div class="mission-layout">${side()}<div>${missionContents(level().missions[i],i)}${s.completed===4?`<button class="btn primary" style="margin-top:20px" data-action="safe">▶ GO TO FINAL SAFE</button>`:''}</div></div></div>`)}
function safeScreen(){let s=session();if(s.completed!==4){screen='mission';return mission()}shell(`<div class="container" style="padding:28px 0 60px;max-width:750px">${codePanel()}<div class="safe ${s.victory?'open':''}"><div class="eyebrow">FINAL SECURITY CHECK</div><h1>${s.victory?'MISSION COMPLETED!':'THE MYSTERY BOX'}</h1><p class="muted">${s.victory?'THE SECRET CODE HAS BEEN CRACKED!':'Enter the four digits you discovered, in mission order, to unlock the mystery box.'}</p><div class="safe-face"><div class="vault-wheel" style="margin:auto;width:165px;height:165px">${s.victory?'✓':'✣'}</div><div style="margin-top:20px">${s.victory?'ACCESS GRANTED · SAFE OPEN':'RESTRICTED ACCESS'}</div></div>${s.victory?`<h2>${safe(s.agency)}</h2><p>LEVEL ${levelId} · ${s.completed}/4 MISSIONS · ${score()}/100 POINTS</p><p>MISSION TIME: ${fmt(s.elapsed)}</p><div class="row" style="justify-content:center"><button class="btn primary" data-action="report">VIEW / DOWNLOAD MISSION REPORT</button><button class="btn" data-action="playAgain">PLAY AGAIN</button></div>`:`<label class="form-label" for="final-code">FOUR-DIGIT COMBINATION</label><input id="final-code" class="safe-input" inputmode="numeric" maxlength="4" placeholder="____" autocomplete="off"><div><button class="btn primary" data-action="unlock">UNLOCK THE BOX</button></div>${feedback?`<p class="feedback error">${safe(feedback)}</p>`:''}`}</div></div>`)}
function modalHtml(){let s=session();if(modal==='how')return `<div class="modal-backdrop"><div class="modal"><h2>HOW TO PLAY</h2><p>1. Choose your level and enter an agency name.</p><p>2. Solve each challenge in English and record your working.</p><p>3. Calculate and enter one digit. Select VERIFY CODE.</p><p>4. Each correct digit unlocks the next mission. Only four verified digits open the final safe.</p><p>5. Written work is saved for teacher review. In teacher-verified mode, a teacher must approve each answer before the next mission unlocks.</p><p><b>Scoring:</b> 25 / 50 / 75 / 100 points for 1 / 2 / 3 / 4 verified missions. Timer does not reduce points.</p><button class="btn primary" data-action="close">CLOSE</button></div></div>`;
if(modal==='approval')return `<div class="modal-backdrop"><div class="modal"><div class="stamp">TEACHER VERIFIED MODE · LOCAL DEVICE</div><h2>TEACHER REVIEW REQUIRED</h2><p>Digit is correct. A teacher must check the student’s written responses before authorizing the unlock.</p><p class="muted">This button is a classroom supervision control, not secure authentication. There is no hardcoded PIN.</p>${level().missions[selectedMission].fields.map(([k,label])=>`<p><b>${safe(label)}:</b> ${safe(s.answers[selectedMission]?.[k]||'(blank)')}</p>`).join('')}<div class="row"><button class="btn primary" data-action="approve">TEACHER: APPROVE & UNLOCK</button><button class="btn" data-action="close">RETURN TO MISSION</button></div></div></div>`;
if(modal==='teacher')return `<div class="modal-backdrop"><div class="modal"><div class="eyebrow">CLASSROOM CONTROL · LOCAL ONLY</div><h2>TEACHER DASHBOARD</h2><p class="muted">⚠ This panel and its answer key are not protected against inspection on a public static site. Use teacher controls only under classroom supervision.</p><label class="form-label">MISSION DURATION</label><select id="duration" class="input-dark">${[10,15,17,20,25].map(n=>`<option ${db.settings.duration===n?'selected':''} value="${n}">${n} minutes</option>`).join('')}</select><label class="field"><input id="teacher-mode" type="checkbox" ${db.settings.teacher?'checked':''} style="width:auto"> Require teacher approval before unlocking</label><label class="field"><input id="competitive-mode" type="checkbox" ${db.settings.competitive?'checked':''} style="width:auto"> Competitive mode flag (no automatic penalties)</label><div class="row"><button class="btn primary" data-action="saveSettings">SAVE SETTINGS</button><button class="btn" data-action="extend" ${!s?'disabled':''}>EXTEND 5 MINUTES</button><button class="btn" data-action="export">EXPORT LOCAL RESULTS</button></div><h3>ANSWER KEY — TEACHER REFERENCE</h3><table class="teacher-table"><tr><th>Level</th><th>Digits</th><th>Code</th></tr>${LEVELS.map(l=>`<tr><td>${l.id} · ${l.name}</td><td>${l.missions.map(m=>m.digit).join(' – ')}</td><td>${l.code}</td></tr>`).join('')}</table><h3>LOCAL TEAM RESULTS</h3><table class="teacher-table"><tr><th>Agency</th><th>Level</th><th>Score</th><th>Report</th></tr>${LEVELS.filter(l=>db.sessions[l.id]).map(l=>`<tr><td>${safe(db.sessions[l.id].agency)}</td><td>${l.id}</td><td>${db.sessions[l.id].completed*25}</td><td><button class="btn sm" data-action="teacherReport" data-id="${l.id}">PRINT</button></td></tr>`).join('')}</table><div class="row"><button class="btn danger" data-action="reset">RESET GAME DATA</button><button class="btn" data-action="close">CLOSE</button></div></div></div>`;return ''}
function render(){if(screen==='home')home();else if(screen==='levels')levels();else if(screen==='agency')agency();else if(screen==='mission')mission();else if(screen==='safe')safeScreen()}
function updateTimer(){const s=session();if(!s||!s.running)return;s.remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));s.elapsed=Math.max(0,db.settings.duration*60-s.remaining);if(s.remaining===0){s.running=false;s.deadline=null;save();toast(`TIME EXPIRED · SCORE ${score()}/100`);render()}else{const el=document.querySelector('#timer-display');if(el){el.textContent=fmt(s.remaining);el.classList.toggle('warning',s.remaining<=120)}if(Date.now()%5000<1000)save()}}
function startTimer(){const s=session();if(!s||s.remaining<=0)return;s.running=true;s.deadline=Date.now()+s.remaining*1000;save()}
function pauseTimer(){const s=session();updateTimer();s.running=false;s.deadline=null;save()}
function saveFields(){if(screen!=='mission')return;const s=session();if(!s||selectedMission>s.completed)return;document.querySelectorAll('[data-field]').forEach(e=>s.answers[selectedMission][e.dataset.field]=e.value);save()}
function completeMission(){const s=session(),i=selectedMission,m=level().missions[i];if(i!==s.completed)return;saveFields();s.digits[i]=m.digit;s.completed++;s.approved[i]=true;feedback='ACCESS GRANTED! Excellent work, Agent! This digit has been verified.';hint='';sound('ok');save();render();if(s.completed===4)toast('ALL FOUR MISSIONS COMPLETE! FINAL SAFE UNLOCKED')}
function checkDigit(){const s=session(),i=selectedMission;if(s.remaining<=0)return toast('Time expired. Ask the teacher to extend time.');if(i!==s.completed)return;const el=document.querySelector('#digit-entry'),v=el?.value||'';if(!isDigit(v)){toast('Enter exactly one digit (0–9).');return}saveFields();if(v!==level().missions[i].digit){s.attempts[i]++;feedback='ACCESS DENIED! Incorrect digit. Review your clues and try again.';sound('fail');save();render();return}if(db.settings.teacher){modal='approval';feedback='';render();return}completeMission()}
function downloadJson(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),sessions:db.sessions},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='secret-code-local-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function reportFor(lid){const l=LEVELS.find(l=>l.id===lid),s=db.sessions[lid];if(!s)return;const didOpen=printReport({level:l,session:s,elapsed:s.elapsed});toast(didOpen?'Print dialog opened. Choose Save as PDF.':'Report HTML downloaded. Open it and choose Print → Save as PDF.')}
function confetti(){const box=document.createElement('div');box.className='confetti';for(let i=0;i<70;i++){const p=document.createElement('i');p.style.setProperty('--x',`${Math.random()*100}%`);p.style.setProperty('--delay',`${Math.random()*1.2}s`);p.style.setProperty('--spin',`${Math.random()*360}deg`);box.append(p)}document.body.append(box);setTimeout(()=>box.remove(),4200)}
document.addEventListener('input',e=>{if(e.target.id==='digit-entry')e.target.value=cleanDigit(e.target.value);if(e.target.id==='final-code')e.target.value=cleanCode(e.target.value);if(e.target.matches('[data-field]'))saveFields()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close'){modal='';return render()}if(a==='teacher'||a==='how'){saveFields();modal=a;return render()}if(a==='sound'){db.settings.sound=!db.settings.sound;save();sound('ok');return render()}if(a==='home'){saveFields();screen='home';levelId=null;modal='';return render()}if(a==='levels'){saveFields();screen='levels';levelId=null;return render()}if(a==='choose'){levelId=Number(b.dataset.id);screen='agency';sound('ok');return render()}if(a==='begin'){const name=document.querySelector('#agency')?.value.trim();if(!name)return toast('Enter your agency name.');const existing=session();if(existing&&existing.agency!==name&&!confirm('Replace the saved agency name for this level?'))return;db.sessions[levelId]??=blank(level(),name);db.sessions[levelId].agency=name;selectedMission=Math.min(session().completed,3);screen=session().victory?'safe':'mission';feedback='';startTimer();return render()}if(a==='mission'){saveFields();selectedMission=Number(b.dataset.index);feedback='';hint='';return render()}if(a==='verify')return checkDigit();if(a==='approve'){modal='';return completeMission()}if(a==='next'){selectedMission=session().completed;feedback='';hint='';screen=selectedMission===4?'safe':'mission';return render()}if(a==='safe'){saveFields();screen='safe';feedback='';return render()}if(a==='hint'){const s=session(),i=selectedMission;if(s.hints[i]>=2)return;s.hints[i]++;hint=level().missions[i].hints[s.hints[i]-1];save();sound('ok');return render()}if(a==='timer'){session().running?pauseTimer():startTimer();return render()}if(a==='resetTimer'){if(!confirm('Reset the timer to its full duration?'))return;const s=session();s.remaining=db.settings.duration*60;s.elapsed=0;s.running=false;s.deadline=null;save();return render()}if(a==='unlock'){const s=session(),v=document.querySelector('#final-code')?.value||'';if(!isCode(v))return toast('Enter all four digits.');s.finalAttempt=v;if(v!==level().code){feedback='INVALID COMBINATION. Check the order of your four digits.';sound('fail');save();return render()}s.victory=true;pauseTimer();sound('win');save();feedback='';render();confetti();return}if(a==='report'){return reportFor(levelId)}if(a==='teacherReport')return reportFor(Number(b.dataset.id));if(a==='export'){downloadJson();return}if(a==='extend'){session().remaining+=300;if(session().running)session().deadline=Date.now()+session().remaining*1000;save();toast('5 minutes added');return render()}if(a==='saveSettings'){db.settings.duration=Number(document.querySelector('#duration').value);db.settings.teacher=document.querySelector('#teacher-mode').checked;db.settings.competitive=document.querySelector('#competitive-mode').checked;save();modal='';toast('Teacher settings saved');return render()}if(a==='reset'||a==='playAgain'){if(!confirm('Delete ALL locally saved progress and begin again?'))return;wipe();db=read();db.settings={duration:17,sound:false,teacher:false,competitive:false};db.sessions={};levelId=null;selectedMission=null;screen='home';modal='';return render()}});
function init(){for(const key of Object.keys(db.sessions)){const s=db.sessions[key];if(s.running&&s.deadline){s.remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if(s.remaining<=0){s.running=false;s.deadline=null}}}save();setInterval(updateTimer,1000);render()}init();

} catch (err) { console.error(err); document.getElementById("app").innerHTML = `<main style="margin:12vh auto;max-width:700px;padding:30px;border-radius:14px;background:#fff;color:#123;font-family:system-ui"><h1>MISSION CONTROL ERROR</h1><p>The game could not start. Reload this page. If the problem continues, try a private window or contact the teacher.</p><pre style="white-space:pre-wrap">${String(err.message || err)}</pre></main>`; }
</script></body></html>
